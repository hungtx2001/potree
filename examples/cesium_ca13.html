<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="" name="description">
  <meta content="" name="author">
  <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
  <title>Potree Viewer</title>

  <link href="../build/potree/potree.css" rel="stylesheet" type="text/css">
  <link href="../libs/jquery-ui/jquery-ui.min.css" rel="stylesheet" type="text/css">
  <link href="../libs/openlayers3/ol.css" rel="stylesheet" type="text/css">
  <link href="../libs/spectrum/spectrum.css" rel="stylesheet" type="text/css">
  <link href="../libs/jstree/themes/mixed/style.css" rel="stylesheet" type="text/css">
  <link href="../libs/Cesium/Widgets/widgets.css" rel="stylesheet" type="text/css">
</head>

<body>
  <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../libs/spectrum/spectrum.js"></script>
  <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../libs/other/BinaryHeap.js"></script>
  <script src="../libs/tween/tween.min.js"></script>
  <script src="../libs/d3/d3.js"></script>
  <script src="../libs/proj4/proj4.js"></script>
  <script src="../libs/openlayers3/ol.js"></script>
  <script src="../libs/i18next/i18next.js"></script>
  <script src="../libs/jstree/jstree.js"></script>
  <script src="../build/potree/potree.js"></script>
  <script src="../libs/plasio/js/laslaz.js"></script>
  <script src="../libs/Cesium/Cesium.js"></script>

  <!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
  <!-- INCLUDE SETTINGS HERE -->

  <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">

    <div id="potree_render_area">
      <div id="cesiumContainer" style="position: absolute; width: 100%; height: 100%;">
      </div>
    </div>
    <div id="potree_sidebar_container"></div>
  </div>


  <script type="module">
    import * as THREE from "../libs/three.js/build/three.module.js";

    // --- Configuration ---
    const listUrl = [
    ];

    window.CESIUM_BASE_URL = "../libs/Cesium/";
    Cesium.Ion.defaultAccessToken = ''
    const initCesium = async () => {
      try {
        // Match production exactly: createWorldTerrainAsync with await
        const terrain = await Cesium.createWorldTerrainAsync();

        // Match production imagery provider
        const imageryProvider = await Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
          Cesium.ArcGisBaseMapType.SATELLITE,
          { enablePickFeatures: false },
        );

        window.cesiumViewer = new Cesium.Viewer('cesiumContainer', {
          useDefaultRenderLoop: false,
          animation: false,
          baseLayerPicker: false,
          fullscreenButton: false,
          geocoder: false,
          homeButton: true,
          infoBox: false,
          sceneModePicker: false,
          selectionIndicator: false,
          timeline: false,
          navigationHelpButton: false,
          imageryProvider: false, // Match production: Disable default
          terrainProvider: terrain, // Match production: Use terrainProvider
        });

        // Match production: Add imagery provider manually
        cesiumViewer.imageryLayers.addImageryProvider(imageryProvider);

        cesiumViewer.scene.globe.depthTestAgainstTerrain = true;
        cesiumViewer.cesiumWidget.creditContainer.style.display = 'none';

        return true;
      } catch (e) {
        console.error("Failed to initialize Cesium:", e);
        return false;
      }
    };

    const cesiumOk = await initCesium();
    if (!cesiumOk) {
      console.warn("Cesium failed to init. Camera sync will not work.");
    }

    window.potreeViewer = new Potree.Viewer(document.getElementById("potree_render_area"), {
      useDefaultRenderLoop: false
    });

    potreeViewer.setEDLEnabled(true);
    potreeViewer.setFOV(60);
    potreeViewer.setPointBudget(30_000_000);
    potreeViewer.setMinNodeSize(0);
    potreeViewer.loadSettingsFromURL();

    // Background is set transparent automatically by setCesiumViewer()

    potreeViewer.loadGUI(() => {
      potreeViewer.setLanguage('vi');
      $("#menu_appearance").next().show();
      $("#menu_tools").next().show();
      $("#menu_scene").next().show();
      potreeViewer.toggleSidebar();
    });

    // --- Projection (from production useProjection.js) ---
    var WGS84 = 'EPSG:4326';
    var VIETNAM_BOUNDS = { minLat: 7, maxLat: 25 };
    var UTM_ZONES = [
      { lonMin: 108, lonMax: 114, proj: '+proj=utm +zone=49 +datum=WGS84 +units=m +no_defs' },
      { lonMin: 102, lonMax: 108, proj: '+proj=utm +zone=48 +datum=WGS84 +units=m +no_defs' },
      { lonMin: 96, lonMax: 102, proj: '+proj=utm +zone=47 +datum=WGS84 +units=m +no_defs' },
    ];
    var FALLBACK_IDX = 1; // zone 48

    var toWGS84 = null;
    var fromWGS84 = null;

    function ensureTransformers() {
      if (!toWGS84) {
        toWGS84 = UTM_ZONES.map(function(z) { return proj4(z.proj, WGS84); });
        fromWGS84 = UTM_ZONES.map(function(z) { return proj4(WGS84, z.proj); });
      }
    }

    var createProjection = function() {
      return {
        toMap: {
          forward: function(xy) {
            ensureTransformers();
            var x = xy[0], y = xy[1];
            var bestResult = null;
            var bestDist = Infinity;

            for (var i = 0; i < UTM_ZONES.length; i++) {
              var result = toWGS84[i].forward([x, y]);
              var lon = result[0], lat = result[1];
              var zone = UTM_ZONES[i];

              if (lon >= zone.lonMin && lon <= zone.lonMax &&
                lat >= VIETNAM_BOUNDS.minLat && lat <= VIETNAM_BOUNDS.maxLat) {
                var dist = Math.abs(lon - 107);
                if (dist < bestDist) {
                  bestDist = dist;
                  bestResult = result;
                }
              }
            }
            return bestResult || toWGS84[FALLBACK_IDX].forward([x, y]);
          },
        },
        toScene: {
          forward: function(lonlat) {
            ensureTransformers();
            var lon = lonlat[0], lat = lonlat[1];
            var idx = -1;
            for (var i = 0; i < UTM_ZONES.length; i++) {
              if (lon >= UTM_ZONES[i].lonMin && lon <= UTM_ZONES[i].lonMax) {
                idx = i;
                break;
              }
            }
            return fromWGS84[idx >= 0 ? idx : FALLBACK_IDX].forward([lon, lat]);
          },
        },
      };
    };

    // --- Load Point Clouds ---
    window.THREE = THREE;

    let loadCount = 0;
    listUrl.forEach(url => {
      Potree.loadPointCloud(url, "Cloud", e => {
        potreeViewer.scene.addPointCloud(e.pointcloud);
        e.pointcloud.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

        if (++loadCount === listUrl.length) {
          // Create projection after all files loaded
          window.projection = createProjection();

          // === KEY: Enable Cesium-driven controls ===
          // This replaces all manual camera sync code.
          // Cesium ScreenSpaceController handles navigation.
          // Potree tools (measure, clip, volume) still work.
          if (window.cesiumViewer && window.projection) {
            potreeViewer.setCesiumViewer(cesiumViewer, projection);
            // Fly Cesium camera to point cloud location
            potreeViewer.cesiumControls.flyToPointCloud(2.5);
          }
        }
      });
    });

    // --- Render Loop ---
    // CRITICAL: Cesium must render FIRST so its camera is up-to-date
    // when CesiumControls.update() reads it for Potree.
    function loop(timestamp) {
      requestAnimationFrame(loop);

      // 1. Cesium renders first → updates its camera from user input
      if (window.cesiumViewer) {
        cesiumViewer.render();
      }

      // 2. Potree reads the now-current Cesium camera → syncs → renders
      potreeViewer.update(potreeViewer.clock.getDelta(), timestamp);
      potreeViewer.render();
    }

    requestAnimationFrame(loop);
  </script>
</body>

</html>
