<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Modern Viewer (ESM Module)</title>

	<link rel="stylesheet" type="text/css" href="../dist/potree.css">
</head>

<body>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
		<div id="potree_render_area"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<script type="module">
		import * as THREE from 'three';
		import { Viewer, loadPointCloud } from '../src/index.js';

		window.viewer = new Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(false);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.loadSettingsFromURL();
		viewer.setBackground("skybox");
		viewer.setDescription("Potree Modern NPM Library Demo");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
			viewer.toggleSidebar();
		});

		loadPointCloud("../pointclouds/vol_total/cloud.js", "vol_total").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);
			viewer.fitToScreen();
		}).catch(err => {
			console.log("Sample pointcloud url ready or not present:", err.message);
		});
	</script>
</body>
</html>
